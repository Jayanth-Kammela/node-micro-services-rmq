name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [customer, products, shopping]

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 8080
      MONGODB_URI: mongodb://127.0.0.1:27017/${{ matrix.service }}_test
      APP_SECRET: ci-test-secret
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_EXPIRATION_MINUTES: 30
      JWT_REFRESH_EXPIRATION_DAYS: 30
      BASE_URL: http://localhost:8080
      EXCHANGE_NAME: ONLINE_SHOPPING
      MSG_QUEUE_URL: amqp://guest:guest@localhost:5672

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for RabbitMQ
        run: |
          for i in $(seq 1 15); do
            (echo > /dev/tcp/localhost/5672) >/dev/null 2>&1 && echo "RabbitMQ is up" && exit 0
            echo "Waiting for RabbitMQ..."
            sleep 2
          done
          echo "RabbitMQ did not become ready in time" && exit 1

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker build check (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [customer, products, shopping, proxy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max